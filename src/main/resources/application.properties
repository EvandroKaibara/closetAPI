spring.application.name=closetapi

# Database connection, override with environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/closet}
spring.datasource.username=${DB_USERNAME:${USER}}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway migrations; Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RFC 9457 problem details for 400/404 responses
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
